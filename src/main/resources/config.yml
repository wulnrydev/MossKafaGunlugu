settings:
  # GUI yuva sayisi 9'un kati olmalidir (18, 27, 36, 45, 54). En az 18 olmalidir.
  gui-size: 54
  # Geri butonuna basildiginda calistirilacak komut (bassiz, "/" olmadan).
  command-on-back: "menü"

database:
  # SQLITE veya MYSQL
  type: SQLITE
  # SQLITE icin dosya adi (plugin klasoru altinda olusturulur).
  sqlite-file: "data.db"
  # Asenkron veri tabani islemleri icin thread havuzu boyutu.
  pool-size: 6
  mysql:
    host: "localhost"
    port: 3306
    database: "mosskafagunlugu"
    username: "root"
    password: ""
    use-ssl: false

messages:
  prefix: "&#15FF08&lSkyBlock &8▸ "
  no-permission: "%prefix%&7Bu komutu kullanmak için &#ffd500yetkiniz &7bulunmuyor."
  reload: "%prefix%&7Eklenti yapılandırması başarıyla &#00D420yenilendi&7."
  reset: "%prefix%&7Sezon başarıyla &#00D420sıfırlandı&7. Yeni sezon: &#ffd500%season%"
  players-only: "%prefix%&7Bu komut yalnızca oyuncular tarafından kullanılabilir."
  no-kills: "%prefix%&7Bu sezonda henüz kimseyi mağlup etmedin."
  opening: "%prefix%&7Kafa günlüğün &#00D420açılıyor&7..."

